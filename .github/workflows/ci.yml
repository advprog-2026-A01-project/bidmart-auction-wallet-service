name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - staging
      - 'refactor/**'
      - 'feat/**'
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build, Test, and PMD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew clean test

      - name: Run PMD
        if: github.ref == 'refs/heads/main'
        run: ./gradlew pmdMain pmdTest

      - name: Upload PMD reports
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pmd-reports
          path: build/reports/pmd/

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image locally
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "$IMAGE_NAME:ci" .

      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA::12}"
          SAFE_REF="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9_.-]#-#g')"

          docker tag "$IMAGE_NAME:ci" "$IMAGE_NAME:$SHORT_SHA"
          docker tag "$IMAGE_NAME:ci" "$IMAGE_NAME:$SAFE_REF"

          docker push "$IMAGE_NAME:$SHORT_SHA"
          docker push "$IMAGE_NAME:$SAFE_REF"

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            docker tag "$IMAGE_NAME:ci" "$IMAGE_NAME:latest"
            docker push "$IMAGE_NAME:latest"
          fi