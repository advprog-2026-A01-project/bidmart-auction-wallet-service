spring.application.name=bidmart-auction-wallet-service
server.port=${PORT:8083}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/auction_wallet_db}
spring.datasource.username=${DB_USERNAME:go.nadine}
spring.datasource.password=${DB_PASSWORD:password123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

gateway.secret=${GATEWAY_SECRET:local-dev-gateway-secret}

# ─── gRPC Server (this service exposes on a separate port) ───────────────────
# Port 9090 is for internal service-to-service gRPC calls only.
# It must NOT be exposed via the public-facing API Gateway.
grpc.server.port=${GRPC_SERVER_PORT:9090}
# Disable TLS for intra-VPC communication (AWS VPC provides network-level isolation).
# Enable mTLS here if stricter transport security is required.
grpc.server.security.enabled=false

# ─── gRPC Client — Auth Service ──────────────────────────────────────────────
# Format: static://<host>:<port>  (use service DNS name in production)
# Example production value: static://bidmart-auth-service:9090
grpc.client.auth-service.address=${AUTH_GRPC_ADDRESS:static://localhost:9090}
grpc.client.auth-service.negotiation-type=plaintext