syntax = "proto3";

package bidmart.auction;

option java_package = "id.ac.ui.cs.advprog.auctionwallet.grpc";
option java_outer_classname = "AuctionServiceProto";
option java_multiple_files = true;

service AuctionGrpcService {
  rpc CreateAuction(CreateAuctionRequest) returns (CreateAuctionResponse);
  rpc GetAuctionStatus(GetAuctionStatusRequest) returns (GetAuctionStatusResponse);
  rpc CancelUserBids(CancelUserBidsRequest) returns (CancelUserBidsResponse);
  rpc CloseAuction(CloseAuctionRequest) returns (CloseAuctionResponse);
}

message CreateAuctionRequest {
  int64  item_id           = 1;
  string starting_price    = 2;
  string minimum_increment = 3;
  string start_time        = 4;  
  string end_time          = 5;  
}

message CreateAuctionResponse {
  bool   success    = 1;
  int64  auction_id = 2;
  string message    = 3;
}

message GetAuctionStatusRequest {
  int64 auction_id = 1;
}

message GetAuctionStatusResponse {
  int64  auction_id            = 1;
  string status                = 2;
  string current_highest_bid   = 3;
  int64  current_highest_bidder_id = 4;
  string end_time              = 5;
}

message CancelUserBidsRequest {
  string user_id = 1;
}

message CancelUserBidsResponse {
  bool   success       = 1;
  int32  bids_cancelled = 2;
  string message       = 3;
}

message CloseAuctionRequest {
  int64 auction_id = 1;
}

message CloseAuctionResponse {
  bool   success    = 1;
  string status     = 2;   
  string message    = 3;
}
